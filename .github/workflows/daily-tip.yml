name: Daily XLClick Tip

on:
  schedule:
    # Esegue ogni giorno alle 09:00 UTC (11:00 in Italia con l'ora legale)
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Permette di avviare l'azione manualmente con il tasto "Run workflow"

jobs:
  send-tip:
    runs-on: ubuntu-latest
    steps:
      # 1. Scarica il codice del repository sul server di GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installa Node.js sul server temporaneo
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Esegue lo script passando i segreti tramite 'with' (richiesto da action.yml)
      # Usiamo 'uses: ./' per indicare a GitHub di usare la logica definita in questo repo
      - name: Run Daily Tip Action
        uses: ./
        with:
          telegram_key: ${{ secrets.TELEGRAM_KEY }}
          chat_id: ${{ secrets.CHAT_ID }}

      # Nota: Se il tuo script index.js legge i dati da process.env, 
      # teniamo anche questi per sicurezza
      env:
        TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
