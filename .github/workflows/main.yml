name: Daily XLClick Tip

on:
  schedule:
    # Runs every day at 09:00 UTC — adjust to your preferred timezone offset
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Required so the workflow can commit the updated data/state.json back to the repo
permissions:
  contents: write

jobs:
  send-tip:
    name: Send daily Excel tip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send tip to Telegram
        id: send
        uses: ./
        with:
          telegram_key: ${{ secrets.TELEGRAM_KEY }}
          chat_id: ${{ secrets.CHAT_ID }}

      - name: Commit updated state
        if: steps.send.outputs.skipped != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: record tip #${{ steps.send.outputs.tip_id }} sent on $(date -u +%Y-%m-%d)"
            # Retry-on-conflict in case another run pushed in the meantime
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $i failed, retrying..."
              sleep 3
            done
          fi
